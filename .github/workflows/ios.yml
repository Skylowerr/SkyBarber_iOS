name: iOS CI

on:
  push:
    branches: [ main, default ]
  pull_request:
    branches: [ main, default ]

jobs:
  build_and_test:
    runs-on: macos-26

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: List installed Xcode versions
        run: ls /Applications | grep Xcode

      - name: Set Default Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer

      - name: Verify Xcode version
        run: xcodebuild -version

      - name: Show available simulators
        run: xcrun simctl list devices available

      # .gitignore ile repo'ya commit edilmeyen Firebase config
      # dosyasını, GitHub Secrets'ta base64 olarak saklanan
      # değerden decode edip doğru path'e yazıyoruz.
      - name: Add GoogleService-Info.plist
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" | base64 --decode > SkyBarber_iOS/GoogleService-Info.plist

      # Firebase SDK'sı Swift Package Manager ile geliyorsa
      # bu adım paketleri (Firebase dahil) önceden indirir,
      # test adımı sırasında zaman kaybını ve olası network
      # timeout hatalarını önler.
      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project SkyBarber_iOS.xcodeproj

      - name: Run Unit & UI Tests
        run: |
          xcodebuild test \
            -project SkyBarber_iOS.xcodeproj \
            -scheme SkyBarber_iOS \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
